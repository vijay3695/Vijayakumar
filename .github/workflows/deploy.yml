name: Build and publish portfolio to branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.html
          grep -q './assets/' dist/index.html
          if find dist -type f \( -iname 'avatar*' -o -iname 'dp.*' -o -iname 'profile-photo*' \) | grep -q .; then
            echo "Refusing to publish: a profile photo is being emitted as a standalone file."
            exit 1
          fi
      - name: Publish built site into main branch root and docs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets docs
          cp -R dist/assets assets
          cp dist/index.html index.html
          cp -R dist docs
          touch .nojekyll docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets docs .nojekyll
          if git diff --cached --quiet; then
            echo "No published files changed."
            exit 0
          fi
          git commit -m "deploy: publish portfolio build [skip ci]"
          git push origin HEAD:main
